name: Build app preview extension

on:
  push:
    branches: [tru-dev]
    paths:
      - 'app-preview-extension/**'
      - '!app-preview-extension/builds/**'
      - '.github/workflows/app-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-preview-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-preview-extension/package-lock.json

      - run: npm ci

      - run: npm run package

      - name: Commit the built extension
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/
          if git diff --staged --quiet; then
            echo "No change under builds/"
            exit 0
          fi
          git commit -m "chore(ci): build app preview extension [skip ci]"
          git push
