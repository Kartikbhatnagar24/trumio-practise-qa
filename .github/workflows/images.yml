name: Build practice app images

on:
  push:
    branches: [tru-dev]
    paths: ['bookhub-api/**', 'bookhub-web/**', 'claimly-api/**', 'claimly-web/**', '.github/workflows/images.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: bookhub-api
            port: 7420
            path: /health
          - app: bookhub-web
            port: 7410
            path: /
          - app: claimly-api
            port: 7460
            path: /health
    steps:
      - uses: actions/checkout@v4

      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Smoke test as a non-root user
        run: |
          docker run -d --name smoke --user 1000 -p ${{ matrix.port }}:${{ matrix.port }} ghcr.io/${{ env.OWNER }}/${{ matrix.app }}:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS -o /dev/null localhost:${{ matrix.port }}${{ matrix.path }} && exit 0; sleep 1; done
          docker logs smoke
          exit 1
