name: Build practice app images

on:
  push:
    branches: [tru-dev]
    paths: ['bookhub-api/**', 'bookhub-web/**', '.github/workflows/images.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [bookhub-api, bookhub-web]
    steps:
      - uses: actions/checkout@v4

      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
